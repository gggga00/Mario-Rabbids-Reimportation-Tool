name: Build executables

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach executables to"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name mrkb_sdf_repacker.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/mrkb_sdf_repacker-windows.exe


  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name mrkb_sdf_repacker-linux mrkb_sdf_repacker.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/mrkb_sdf_repacker-linux


  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name mrkb_sdf_repacker-x86_64 mrkb_sdf_repacker.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: dist/mrkb_sdf_repacker-x86_64


  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name mrkb_sdf_repacker-arm64 mrkb_sdf_repacker.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/mrkb_sdf_repacker-arm64


  create-macos-universal:
    name: Create macOS Universal
    needs:
      - build-macos-intel
      - build-macos-arm64
    runs-on: macos-14

    steps:
      - name: Download Intel build
        uses: actions/download-artifact@v4
        with:
          name: macos-intel
          path: intel

      - name: Download ARM64 build
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: arm64

      - name: Create universal binary
        run: |
          lipo -create \
            intel/mrkb_sdf_repacker-x86_64 \
            arm64/mrkb_sdf_repacker-arm64 \
            -output mrkb_sdf_repacker-macos

      - name: Verify universal binary
        run: |
          file mrkb_sdf_repacker-macos
          lipo -info mrkb_sdf_repacker-macos

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: mrkb_sdf_repacker-macos


  release:
    name: Attach executables to release
    needs:
      - build-windows
      - build-linux
      - create-macos-universal
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: release

      - name: Show release files
        run: ls -lah release

      - name: Attach executables to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/mrkb_sdf_repacker-windows.exe
            release/mrkb_sdf_repacker-linux
            release/mrkb_sdf_repacker-macos
